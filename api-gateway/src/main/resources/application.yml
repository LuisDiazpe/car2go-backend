server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Descubre microservicios via Eureka automaticamente
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-iam
          uri: lb://ms-iam
          predicates:
            - Path=/api/v1/auth/**
        - id: ms-iam-users
          uri: lb://ms-iam
          predicates:
            - Path=/api/v1/users/**
        - id: ms-vehicle
          uri: lb://ms-vehicle
          predicates:
            - Path=/api/v1/vehicles/**
        - id: ms-inspection
          uri: lb://ms-inspection
          predicates:
            - Path=/api/v1/inspections/**
        - id: ms-payment
          uri: lb://ms-payment
          predicates:
            - Path=/api/v1/transactions/**
        - id: ms-userinteraction
          uri: lb://ms-userinteraction
          predicates:
            - Path=/api/v1/favorites/**,/api/v1/comments/**,/api/v1/reviews/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

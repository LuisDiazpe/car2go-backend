name: CI - Build & Test

# Se ejecuta en cada push y pull request hacia las ramas principales.
# Compila y prueba cada microservicio de forma independiente (matriz).
on:
  push:
    branches: [ main, develop, feature/microservices-migration ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # si un servicio falla, los demas igual se compilan
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - ms-iam
          - ms-vehicle
          - ms-inspection
          - ms-payment
          - ms-userinteraction

    name: Build ${{ matrix.service }}
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y testear ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean verify

      - name: Publicar reporte de tests
        if: always()   # publica el reporte aunque los tests fallen
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

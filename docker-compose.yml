services:

  # ── Base de datos MySQL (con las 5 BD de los microservicios) ──
  mysql:
    image: mysql:8.0
    container_name: car2go-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      # Crea automaticamente la primera BD; las demas las crea el init script
      MYSQL_DATABASE: db_iam
    ports:
      - "3307:3306"   # 3307 afuera para no chocar con tu MySQL local
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Eureka Service Discovery ──
  discovery-server:
    build: ./discovery-server
    container_name: car2go-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Config Server ──
  config-server:
    build: ./config-server
    container_name: car2go-config
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy

  # ── API Gateway ──
  api-gateway:
    build: ./api-gateway
    container_name: car2go-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ChangeThisSecretInProductionWithAtLeast512BitsForHS512AlgorithmABCDEF1234567890
    depends_on:
      discovery-server:
        condition: service_healthy

  # ── Microservicio IAM ──
  ms-iam:
    build: ./ms-iam
    container_name: car2go-iam
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/db_iam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: "12345678"
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ChangeThisSecretInProductionWithAtLeast512BitsForHS512AlgorithmABCDEF1234567890
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ── Microservicio Vehicle ──
  ms-vehicle:
    build: ./ms-vehicle
    container_name: car2go-vehicle
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/db_vehicle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: "12345678"
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ── Microservicio Inspection ──
  ms-inspection:
    build: ./ms-inspection
    container_name: car2go-inspection
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/db_inspection?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: "12345678"
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ── Microservicio Payment ──
  ms-payment:
    build: ./ms-payment
    container_name: car2go-payment
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/db_payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: "12345678"
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ── Microservicio User Interaction ──
  ms-userinteraction:
    build: ./ms-userinteraction
    container_name: car2go-userinteraction
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/db_userinteraction?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: "12345678"
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

volumes:
  mysql-data:

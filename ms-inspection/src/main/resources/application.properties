spring.application.name=ms-inspection
server.port=${PORT:8083}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/db_inspection?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.pe.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Circuit Breaker (Resilience4j) para llamadas a ms-vehicle
resilience4j.circuitbreaker.instances.vehicleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.vehicleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vehicleService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vehicleService.permitted-number-of-calls-in-half-open-state=3

# Feign timeout
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info

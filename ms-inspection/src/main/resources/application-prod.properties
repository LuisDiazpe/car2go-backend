# ===== Perfil de PRODUCCION (Render) para ms-inspection =====

spring.application.name=ms-inspection

# BD compartida FreeSQLDatabase (Opcion B: separacion logica por tablas)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Eureka en la nube =====
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=false
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${RENDER_EXTERNAL_HOSTNAME}
eureka.instance.status-page-url=https://${RENDER_EXTERNAL_HOSTNAME}/actuator/info
eureka.instance.health-check-url=https://${RENDER_EXTERNAL_HOSTNAME}/actuator/health
eureka.instance.home-page-url=https://${RENDER_EXTERNAL_HOSTNAME}/

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Circuit Breaker + Feign (solo inspection) =====
resilience4j.circuitbreaker.instances.vehicleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.vehicleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vehicleService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vehicleService.permitted-number-of-calls-in-half-open-state=3
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

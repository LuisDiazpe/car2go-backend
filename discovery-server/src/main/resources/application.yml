server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-server
  security:
    user:
      name: ${EUREKA_USER:admin}
      password: ${EUREKA_PASSWORD:admin123}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.application.name=ms-iam
server.port=${PORT:8081}

# --- BD propia del microservicio IAM ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/db_iam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.pe.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# --- JWT ---
authorization.jwt.secret=${JWT_SECRET:ChangeThisSecretInProductionWithAtLeast512BitsForHS512AlgorithmABCDEF1234567890}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# ============================================================
# Car2Go — Application Properties
# ============================================================

spring.application.name=Car2Go Platform

# --- DataSource (Render MySQL en prod, localhost en dev) ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/car2go?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.pe.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# --- JWT ---
authorization.jwt.secret=${JWT_SECRET:ChangeThisSecretInProductionWithAtLeast256BitsOfEntropy}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# --- CORS (Cloudflare Pages en prod) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- OpenAPI / Swagger ---
documentation.application.description=Car2Go Platform API
documentation.application.version=1.0.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- Server ---
server.port=${PORT:8080}